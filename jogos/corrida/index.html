<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corrida do Chat</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  /* topo: pilotos, volta e número da corrida */
  .topo{position:absolute;left:24px;right:24px;top:22px;display:flex;align-items:center;justify-content:space-between;z-index:5}
  .topo .pilula{font-size:60px;padding:8px 38px}
  .topo .pilula.pequena{font-size:40px;padding:8px 22px;border-width:4px}
  .titulo{position:absolute;left:0;right:0;top:122px;text-align:center;font-size:44px;color:#fff;z-index:5}
  .titulo span{color:var(--ouro)}

  /* presentes nos cantos, fora da pista */
  .canto{position:absolute;width:190px;text-align:center;z-index:4}
  .canto .emoji{font-size:78px}
  .canto .efeito{font-size:34px}
  .canto .nome{display:block;margin-top:2px;font-size:22px;font-weight:800;color:#fff;
    text-shadow:0 2px 0 var(--contorno),0 0 6px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .canto.c0{left:8px;top:196px}.canto.c1{right:8px;top:196px}
  .canto.c2{left:8px;top:1322px}.canto.c3{right:8px;top:1322px}
  .canto.usou{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}

  /* miolo da pista: posições ao vivo e avisos */
  .posicoes{position:absolute;left:372px;width:336px;top:560px;z-index:4}
  .posicoes h3,.caixa h3{margin:0 0 8px 6px;font-size:34px;color:#fff}
  .posicoes ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .posicoes li{display:flex;align-items:center;gap:10px;padding:3px 14px 3px 5px;border-radius:999px;
    background:linear-gradient(90deg,color-mix(in srgb,var(--cor) 55%,rgba(14,10,32,.92)),rgba(14,10,32,.88) 75%);
    border:3px solid rgba(255,255,255,.2);font-size:26px;font-weight:800;line-height:1.1}
  .posicoes li.lider{border-color:var(--ouro);box-shadow:0 0 18px rgba(255,210,63,.5)}
  .posicoes li .pos{width:42px;text-align:center;font-family:var(--fonte-jogo);font-size:30px;color:var(--ouro)}
  .posicoes li .avatar{--tam:44px;border-width:3px}
  .posicoes li .quem{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .posicoes li .v{font-family:var(--fonte-jogo);font-size:22px;color:#cfe3ff;opacity:.9}
  .posicoes .vazio{font-size:26px;opacity:.85;padding:6px}
  .avisos{position:absolute;left:366px;width:348px;top:925px;z-index:6}
  .avisos .aviso{font-size:24px;padding:8px 18px;border-radius:24px;line-height:1.15;gap:8px}
  .aviso .mais{color:var(--ouro)}
  .aviso .ruim{color:#ff5a6e}
  .aviso .roxo{color:#c79bff}

  /* chamada e contagem da largada (acima de tudo) */
  .chamada{position:absolute;left:0;right:0;top:770px;z-index:12;text-align:center;font-size:76px;color:#3df2c2;
    animation:pulsa .6s ease-in-out infinite alternate;pointer-events:none}
  .chamada small{display:block;font-size:40px;color:#fff;margin-top:10px}
  .largada{position:absolute;left:0;right:0;top:720px;z-index:12;text-align:center;font-size:260px;color:var(--ouro);pointer-events:none}
  .largada.ja{color:#3df2c2;font-size:220px}
  .largada.some{animation:somePraFrente .7s ease forwards}
  @keyframes somePraFrente{to{opacity:0;transform:scale(1.8)}}
  .banner{position:absolute;left:0;right:0;top:330px;z-index:13;text-align:center;font-size:96px;color:#fff;pointer-events:none;
    animation:banner 2.2s cubic-bezier(.2,1.3,.4,1) both}
  .banner small{display:block;font-size:46px;color:var(--ouro)}
  @keyframes banner{0%{opacity:0;transform:scale(.3) rotate(-8deg)}15%{opacity:1;transform:scale(1.1)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}
  .flash{position:absolute;inset:0;z-index:11;pointer-events:none;background:radial-gradient(circle at var(--x) var(--y),rgba(214,170,255,.75),rgba(120,80,255,.25) 30%,transparent 60%);
    animation:flash .6s ease-out forwards}
  @keyframes flash{to{opacity:0}}

  /* rodapé: mais enviados e vitórias */
  .caixa{position:absolute;top:1540px;z-index:4}
  .caixa.enviados{left:24px;width:560px}
  .caixa.vitorias{right:24px;width:452px}
  .caixa .ranking{gap:9px}
  .caixa .ranking-item{font-size:27px;padding:4px 18px 4px 6px;gap:12px}
  .caixa .avatar.pequeno{--tam:50px}
  .caixa .ranking-pos{width:44px;font-size:34px}
  .caixa .ranking-pts{font-size:34px}
  .caixa .vazio{font-size:26px;opacity:.9;padding:6px 10px;
    text-shadow:0 2px 0 var(--contorno)}

  /* pódio do fim da corrida */
  .podio{position:absolute;z-index:20;left:50px;right:50px;top:420px;height:860px;border-radius:48px;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%,rgba(70,46,140,.97),rgba(12,8,30,.97));border:6px solid var(--ouro);
    box-shadow:0 0 0 8px rgba(0,0,0,.35),0 0 90px rgba(255,210,63,.55);animation:vencedor .6s cubic-bezier(.2,1.4,.4,1) both}
  .podio .cab{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:96px;color:#fff}
  .podio .cab small{display:block;font-size:42px;color:var(--ouro);letter-spacing:.06em;margin-bottom:6px}
  .degraus{position:absolute;left:30px;right:30px;bottom:0;display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:14px}
  .degrau{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
  .degrau .avatar{box-shadow:0 0 0 6px rgba(0,0,0,.25),0 0 40px var(--cor);border-color:var(--cor);
    animation:caiAvatar .7s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--atraso)}
  .degrau .quem{max-width:100%;font-size:40px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;
    animation:caiAvatar .7s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--atraso)}
  .degrau .bloco{width:100%;height:var(--h);border-radius:22px 22px 0 0;display:grid;place-items:start center;padding-top:16px;
    background:linear-gradient(180deg,color-mix(in srgb,var(--cor) 70%,#fff) 0%,var(--cor) 30%,color-mix(in srgb,var(--cor) 60%,#000) 100%);
    box-shadow:inset 0 6px 0 rgba(255,255,255,.35);transform-origin:bottom;animation:sobe .6s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--atraso) - .3s)}
  .degrau .bloco b{font-size:110px;color:#fff}
  .degrau .medalha{font-size:70px;line-height:1;animation:caiAvatar .7s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--atraso)}
  .degrau.p1 .quem{font-size:48px;color:var(--ouro)}
  @keyframes sobe{from{transform:scaleY(0)}}
  @keyframes caiAvatar{from{opacity:0;transform:translateY(-160px) scale(.5)}}
</style>
</head>
<body>
<div class="palco">
  <canvas id="tela" width="1080" height="1920"></canvas>

  <div class="topo">
    <div class="pilula pequena" id="pilotos">🏎️ 0</div>
    <div class="pilula" id="volta">VOLTA 1/3</div>
    <div class="pilula pequena" id="numero">🏁 #1</div>
  </div>
  <div class="titulo titulo-jogo">Corrida <span>do Chat</span></div>

  <div id="cantos"></div>

  <section class="posicoes"><h3 class="titulo-jogo">🏁 Posições</h3><ol id="posicoes"></ol></section>
  <div class="avisos" id="avisos"></div>
  <div class="chamada txt-jogo" id="chamada">COMENTE<br>PARA CORRER<small>💬 qualquer mensagem entra na pista</small></div>
  <div class="largada txt-jogo" id="largada"></div>

  <section class="caixa enviados"><h3 class="titulo-jogo">🔥 Mais enviados</h3><ol class="ranking" id="ranking"></ol></section>
  <section class="caixa vitorias"><h3 class="titulo-jogo">🏆 Vitórias</h3><ol class="ranking" id="vitorias"></ol></section>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
