<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corrida do Chat</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .topo{position:absolute;left:40px;right:40px;top:22px}
  .linha{display:flex;align-items:center;justify-content:space-between;gap:20px}
  h1{margin:0;font-size:62px;font-weight:900;letter-spacing:-.02em;line-height:1.05}
  h1 span{color:#3df2c2}
  .volta{padding:8px 22px;border-radius:999px;background:#ffc23d;color:#0b0d17;font-size:34px;font-weight:900;white-space:nowrap}
  .legenda{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:12px}
  .legenda span{padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.14);font-size:27px;font-weight:800}
  .painel{position:absolute;background:rgba(8,10,20,.72);border:2px solid rgba(255,255,255,.12);border-radius:28px;padding:16px 22px}
  .painel h2{margin:0 0 8px;font-size:26px;font-weight:900;letter-spacing:.16em;color:rgba(255,255,255,.78)}
  .painel ol{list-style:none;margin:0;padding:0}
  .posicoes{left:352px;width:376px;top:530px}
  .posicoes li{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:800;line-height:44px;white-space:nowrap}
  .posicoes li i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--c)}
  .posicoes li b{flex:none;width:52px;color:#ffc23d}
  .posicoes li span{overflow:hidden;text-overflow:ellipsis}
  .avisos{position:absolute;left:352px;width:376px;top:1030px}
  .aviso{font-size:28px;padding:12px 18px;border-radius:18px}
  .vitorias{left:40px;right:40px;top:1668px;bottom:24px}
  .vitorias ol{display:flex;flex-wrap:wrap;gap:10px 14px}
  .vitorias li{padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.07);font-size:32px;font-weight:800;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .vitorias li b{color:#ffc23d}
  .vitorias .vazio{opacity:.8;font-weight:700;background:none;padding:8px 0}
  .vencedor{--destaque:#ffc23d}
</style>
</head>
<body>
<div class="palco">
  <canvas id="tela" width="1080" height="1920"></canvas>
  <header class="topo">
    <div class="linha"><h1>CORRIDA <span>DO CHAT</span></h1><div class="volta" id="volta">VOLTA 1/3</div></div>
    <div class="legenda" id="legenda"></div>
  </header>
  <section class="painel posicoes"><h2>POSIÇÕES</h2><ol id="posicoes"></ol></section>
  <div class="avisos" id="avisos"></div>
  <section class="painel vitorias"><h2>🏆 VITÓRIAS DA SESSÃO</h2><ol id="vitorias"></ol></section>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
