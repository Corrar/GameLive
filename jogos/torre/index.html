<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torre Alta</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  body{font-weight:800}
  .hud{position:absolute;left:40px;right:40px;top:40px;display:flex;gap:20px}
  .caixa{flex:1;padding:20px 30px 22px;border-radius:34px;background:rgba(8,10,20,.84);border:3px solid rgba(255,255,255,.12);
    box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
  .caixa small{display:block;font-size:28px;font-weight:900;letter-spacing:.2em;color:rgba(255,255,255,.62)}
  .caixa b{display:block;font-size:128px;font-weight:900;line-height:1;color:#3df2c2;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .caixa span{font-size:30px;font-weight:800;color:rgba(255,255,255,.62)}
  .caixa.rec{flex:.8}
  .caixa.rec b{color:#ffc23d;font-size:96px;margin-top:14px}
  .caixa.rec.pulso{animation:recorde .9s cubic-bezier(.2,1.4,.4,1)}
  @keyframes recorde{30%{transform:scale(1.08);border-color:#ffc23d}}
  .ultimo{position:absolute;left:40px;right:40px;top:300px;padding:16px 26px;border-radius:24px;background:rgba(8,10,20,.78);
    font-size:38px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .avisos{position:absolute;left:40px;right:40px;top:400px}
  .legenda{position:absolute;left:30px;right:30px;bottom:30px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .legenda div{padding:10px 18px;border-radius:999px;background:rgba(8,10,20,.84);border:2px solid rgba(255,255,255,.14);font-size:28px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legenda i{font-style:normal;color:#3df2c2}
</style>
</head>
<body>
<div class="palco">
  <canvas id="tela" width="1080" height="1920"></canvas>
  <header class="hud">
    <div class="caixa"><small>ALTURA</small><b id="altura">0</b><span>blocos</span></div>
    <div class="caixa rec" id="caixaRec"><small>RECORDE</small><b id="recorde">0</b></div>
  </header>
  <div class="ultimo" id="ultimo"></div>
  <div class="avisos" id="avisos"></div>
  <footer class="legenda" id="legenda"></footer>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
