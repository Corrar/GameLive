<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urna da Live</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .urna{position:absolute;left:40px;right:40px;top:40px;padding:30px 34px 28px;border-radius:36px;
    background:rgba(8,10,20,.86);border:3px solid rgba(255,255,255,.12);box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
  .titulo{text-align:center;font-size:30px;font-weight:800;letter-spacing:.22em;color:rgba(255,255,255,.62);margin-bottom:18px}
  .lados{display:flex;justify-content:space-between;align-items:center;gap:20px}
  .lado{display:flex;align-items:center;gap:16px;min-width:0}
  .lado.l1{flex-direction:row-reverse;text-align:right}
  .foto{width:84px;height:84px;flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;
    font-size:34px;font-weight:900;color:#0b0d17;background:var(--cor);border:4px solid rgba(255,255,255,.85)}
  .foto img{width:100%;height:100%;object-fit:cover}
  .nome{font-size:42px;font-weight:900;line-height:1.05;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:330px}
  .pct{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--cor);line-height:1}
  .barra{position:relative;display:flex;height:66px;margin-top:22px;border-radius:33px;overflow:hidden;background:#1b2036;
    border:3px solid rgba(255,255,255,.18)}
  .seg{position:absolute;inset:0;background:var(--cor);transition:filter .3s}
  .seg.l0{z-index:1;transform-origin:left center;transition:transform .45s cubic-bezier(.2,.8,.3,1),filter .3s}
  .seg.l0{background:linear-gradient(90deg,color-mix(in srgb,var(--cor) 70%,#000),var(--cor))}
  .seg.l1{background:linear-gradient(90deg,var(--cor),color-mix(in srgb,var(--cor) 70%,#000))}
  .seg.pulso{filter:brightness(1.45)}
  .meio{position:absolute;z-index:2;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:rgba(255,255,255,.55)}
  .totais{display:flex;justify-content:space-between;margin-top:14px;font-size:30px;font-weight:700;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums}
  .l0{--cor:var(--cor-a)}.l1{--cor:var(--cor-b)}
  .avisos{position:absolute;left:40px;right:40px;top:420px}
  .aviso .mais{color:var(--cor)}
  .virada{position:absolute;left:60px;right:60px;top:820px;padding:44px 30px;border-radius:40px;text-align:center;
    background:rgba(8,10,20,.92);border:5px solid var(--cor);font-size:92px;font-weight:900;line-height:1.05;
    animation:virada 2.6s cubic-bezier(.2,1.3,.4,1) both}
  .virada small{display:block;font-size:40px;letter-spacing:.2em;color:var(--cor);margin-bottom:10px}
  @keyframes virada{0%{opacity:0;transform:scale(.5) rotate(-4deg)}15%{opacity:1;transform:scale(1.05)}25%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(.96)}}
</style>
</head>
<body>
<div class="palco">
  <header class="urna">
    <div class="titulo" id="titulo"></div>
    <div class="lados">
      <div class="lado l0"><span class="foto" id="foto0"></span><div><div class="nome" id="nome0"></div><div class="pct" id="pct0">50%</div></div></div>
      <div class="lado l1"><span class="foto" id="foto1"></span><div><div class="nome" id="nome1"></div><div class="pct" id="pct1">50%</div></div></div>
    </div>
    <div class="barra"><div class="seg l0" id="seg0"></div><div class="seg l1" id="seg1"></div><div class="meio"></div></div>
    <div class="totais"><span id="total0">0 votos</span><span id="total1">0 votos</span></div>
  </header>
  <div class="avisos" id="avisos"></div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
