<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urna da Live</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .l0{--cor:var(--cor-a)}.l1{--cor:var(--cor-b)}

  /* fundo "estudio": sala quente com holofotes e uma mesa embaixo da urna */
  .estudio{position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(60% 34% at 50% 20%,rgba(255,226,150,.55),transparent 70%),
      radial-gradient(40% 30% at 12% 8%,rgba(255,190,90,.45),transparent 70%),
      radial-gradient(40% 30% at 88% 8%,rgba(255,190,90,.45),transparent 70%),
      linear-gradient(180deg,#7a3a12 0%,#c8681c 30%,#e08a2a 44%,#9b4a14 46%)}
  .estudio::after{content:"";position:absolute;left:-10%;right:-10%;top:44%;bottom:0;
    background:linear-gradient(180deg,#f2b25a 0%,#e7a04a 30%,#d48a38 100%);
    box-shadow:inset 0 14px 30px rgba(120,50,10,.45)}
  .estudio i{position:absolute;top:-10%;width:340px;height:120%;background:linear-gradient(180deg,rgba(255,240,200,.18),transparent 70%);
    filter:blur(6px);transform-origin:top center}
  .estudio i:nth-child(1){left:6%;transform:rotate(14deg)}
  .estudio i:nth-child(2){right:6%;transform:rotate(-14deg)}

  /* topo: troféus e cronômetro */
  .topo{position:absolute;left:40px;right:40px;top:34px;display:flex;align-items:center;justify-content:space-between}
  .trofeu{display:flex;align-items:center;gap:6px;font-size:84px;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
  .trofeu b{font-size:64px;color:#fff}
  .titulo{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:40px;color:#fff;opacity:.95}

  /* placar */
  .placar{position:absolute;left:30px;right:30px;top:210px;display:grid;grid-template-columns:1fr 1fr;text-align:center}
  .lado .nome{font-size:50px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px}
  .lado .votos{font-size:240px;color:#fff;display:inline-block;margin-top:6px}
  .lado .pct{font-size:96px;color:var(--cor);display:block;margin-top:4px;font-variant-numeric:tabular-nums}
  .lado .combo{height:70px;margin-top:6px;font-size:62px;color:var(--ouro);opacity:0;transition:opacity .2s}
  .lado .combo.on{opacity:1}

  /* barra */
  .barra{position:absolute;left:60px;right:60px;top:735px;height:84px;border-radius:42px;overflow:hidden;
    background:var(--cor-b);border:6px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.28),0 0 40px rgba(0,0,0,.25)}
  .seg{position:absolute;inset:0}
  .seg.l1{background:linear-gradient(180deg,color-mix(in srgb,var(--cor) 60%,#fff) 0%,var(--cor) 45%,color-mix(in srgb,var(--cor) 70%,#000) 100%)}
  .seg.l0{z-index:1;transform-origin:left center;transition:transform .5s cubic-bezier(.2,1.2,.4,1);
    background:linear-gradient(180deg,color-mix(in srgb,var(--cor) 60%,#fff) 0%,var(--cor) 45%,color-mix(in srgb,var(--cor) 70%,#000) 100%)}
  .reflexo{position:absolute;z-index:2;inset:8px 24px auto;height:18px;border-radius:9px;background:rgba(255,255,255,.45)}
  .faisca{position:absolute;z-index:3;top:-6px;bottom:-6px;left:0;width:10px;margin-left:-5px;background:#fff;
    box-shadow:0 0 18px 6px rgba(255,255,255,.9);transition:transform .5s cubic-bezier(.2,1.2,.4,1)}
  .barra.pulso0 .seg.l0,.barra.pulso1 .seg.l1{filter:brightness(1.35)}

  /* faixa acima de cada urna: presentes do lado + quem votou por último */
  .faixa{position:absolute;top:900px;width:500px;height:120px;display:flex;align-items:center;gap:18px}
  .faixa.l0{left:30px}
  .faixa.l1{right:30px;flex-direction:row-reverse}
  .faixa .chip-presente .emoji{font-size:64px}
  .faixa .chip-presente .efeito{font-size:36px}
  .ultimo{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .faixa.l1 .ultimo{flex-direction:row-reverse}
  .ultimo .avatar{--tam:70px;border-color:var(--cor);box-shadow:0 0 0 5px rgba(0,0,0,.2),0 0 26px var(--cor)}
  .ultimo .quem{font-size:32px;color:#fff;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* duas urnas eletrônicas, uma por lado; a mão de cada uma digita o número do lado */
  .urna-maquina{position:absolute;top:1050px;width:500px;height:310px;transform:perspective(1300px) rotateX(20deg);transform-origin:50% 100%}
  .urna-maquina.l0{left:30px}
  .urna-maquina.l1{right:30px}
  .corpo{position:absolute;inset:0 0 18px;border-radius:22px 22px 14px 14px;
    background:linear-gradient(180deg,#fbfaf5 0%,#ecebe3 18%,#dedcd2 70%,#cac8bd 100%);
    box-shadow:inset 0 3px 0 #fff,inset 0 -6px 0 rgba(0,0,0,.08),0 0 0 2px #b9b7ac}
  .base{position:absolute;left:10px;right:10px;bottom:0;height:24px;border-radius:0 0 12px 12px;
    background:repeating-linear-gradient(90deg,#b6b4a8 0 2px,transparent 2px 58px),linear-gradient(180deg,#d6d4c9,#a9a79b);
    box-shadow:0 22px 34px rgba(90,35,0,.45)}
  .tela{position:absolute;left:20px;top:30px;width:268px;height:224px;border-radius:8px;padding:14px 16px;overflow:hidden;
    background:linear-gradient(180deg,#f6f8f2,#e3e7dc);border:7px solid #9a9d95;box-shadow:inset 0 3px 8px rgba(0,0,0,.2);
    color:#222;font-family:"Baloo 2",sans-serif}
  .numero-linha{display:flex;align-items:center;gap:8px}
  .rot{font-size:20px;color:#444}
  .digitos{display:flex;gap:6px}
  .digito{width:48px;height:62px;border:3px solid #222;border-radius:3px;background:#fff;display:grid;place-items:center;
    font:400 52px/1 var(--fonte-jogo);color:#111;position:relative}
  .digito.cursor::after{content:"";position:absolute;left:8px;right:8px;bottom:8px;height:5px;background:#111;animation:cursor .7s steps(1) infinite}
  @keyframes cursor{50%{opacity:0}}
  .candidato{position:absolute;right:12px;top:82px;width:70px;height:88px;border:3px solid #222;border-radius:3px;overflow:hidden;
    background:var(--cor,#bbb);display:none;place-items:center;font:400 34px/1 var(--fonte-jogo);color:#fff;
    -webkit-text-stroke:5px var(--contorno);paint-order:stroke fill}
  .candidato.on{display:grid}
  .candidato img{width:100%;height:100%;object-fit:cover}
  .nome-cand{margin-top:12px;margin-right:80px;font-size:26px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:30px}
  .instr{position:absolute;left:14px;right:14px;bottom:8px;border-top:2px solid #333;padding-top:4px;font-size:14px;line-height:1.2;color:#333}
  .fim{position:absolute;inset:0;display:grid;place-items:center;background:#f6f8f2;font:400 104px/1 var(--fonte-jogo);color:#111;opacity:0}
  .fim.on{animation:fim .9s ease both}
  @keyframes fim{0%,100%{opacity:0}10%,80%{opacity:1}}
  .marca{position:absolute;right:16px;top:8px;width:178px;height:30px;border-radius:4px;display:grid;place-items:center;
    background:#f7f6f0;border:2px solid #b9b7ac;font:800 17px/1 "Baloo 2",sans-serif;color:#333;letter-spacing:.03em;overflow:hidden;white-space:nowrap}
  .teclado{position:absolute;right:16px;top:44px;width:178px;height:212px;border-radius:10px;padding:12px 12px 10px;
    background:linear-gradient(180deg,#3b3b3b,#1d1d1d);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 2px 0 #8f8d83}
  .teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:7px 12px;padding:0 6px}
  .tecla{height:30px;border-radius:5px;background:linear-gradient(180deg,#2c2c2c,#0b0b0b);box-shadow:0 4px 0 #000,inset 0 2px 0 rgba(255,255,255,.2);
    display:grid;place-items:center;font:800 20px/1 "Baloo 2",sans-serif;color:#fff;transition:transform .07s,box-shadow .07s,filter .07s}
  .tecla.zero{grid-column:2}
  .tecla.apertada{transform:translateY(4px);box-shadow:0 0 0 #000,inset 0 2px 0 rgba(255,255,255,.2);filter:brightness(2.2)}
  .botoes{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px}
  .botao{height:32px;border-radius:4px;display:grid;place-items:center;font:800 10px/1 "Baloo 2",sans-serif;color:#111;
    box-shadow:0 4px 0 rgba(0,0,0,.6);transition:transform .07s,box-shadow .07s}
  .botao.branco{background:#f4f4f4}.botao.corrige{background:#ff8a1f}.botao.confirma{background:#2fcf55}
  .botao.apertada{transform:translateY(4px);box-shadow:none;filter:brightness(1.3)}

  /* mão (SVG): a ponta do indicador fica em (100,10) do desenho */
  .mao{position:absolute;z-index:4;left:0;top:0;width:200px;height:440px;pointer-events:none;transform-origin:100px 10px;
    transition:transform .17s cubic-bezier(.3,.8,.4,1);filter:drop-shadow(10px 18px 10px rgba(60,20,0,.35))}
  .mao svg{width:100%;height:100%;overflow:visible}
  .clique{position:absolute;z-index:5;width:46px;height:46px;margin:-23px;border-radius:50%;border:5px solid #fff;pointer-events:none;
    animation:clique .35s ease-out forwards}
  @keyframes clique{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}

  /* avisos e ranking */
  .avisos{position:absolute;left:630px;right:30px;bottom:40px;flex-direction:column-reverse;align-items:stretch}
  .avisos .aviso{font-size:26px;padding:8px 18px;border-radius:26px;line-height:1.15}
  .aviso .mais{color:var(--cor)}
  .ranking-box{position:absolute;left:40px;width:560px;bottom:36px}
  .ranking-box h3{margin:0 0 10px 6px;font-size:40px;color:#fff}
  .ranking-box .ranking-item{font-size:28px;padding:4px 18px 4px 8px}
  .ranking-box .avatar.pequeno{--tam:52px}
  .ranking-box .ranking-pts{font-size:36px}

  /* virada */
  .virada{position:absolute;z-index:22;left:60px;right:60px;top:560px;padding:40px 30px;border-radius:48px;text-align:center;
    background:radial-gradient(120% 140% at 50% 0%,rgba(60,40,120,.96),rgba(12,8,30,.96));border:7px solid var(--cor);
    box-shadow:0 0 70px var(--cor);font-size:100px;color:#fff;animation:virada 2.6s cubic-bezier(.2,1.3,.4,1) both}
  .virada small{display:block;font-size:56px;color:var(--cor);margin-bottom:8px}
  @keyframes virada{0%{opacity:0;transform:scale(.4) rotate(-6deg)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(.96)}}

  .transparente .estudio{display:none}
</style>
</head>
<body>
<div class="palco">
  <div class="estudio" id="estudio"><i></i><i></i></div>

  <div class="topo">
    <div class="trofeu l0">🏆<b class="txt-jogo" id="trofeu0">0</b></div>
    <div class="pilula" id="relogio">∞</div>
    <div class="trofeu l1"><b class="txt-jogo" id="trofeu1">0</b>🏆</div>
  </div>
  <div class="titulo titulo-jogo" id="titulo"></div>

  <div class="placar">
    <div class="lado l0"><div class="nome txt-jogo" id="nome0"></div><div class="votos txt-jogo" id="votos0">0</div>
      <span class="pct txt-jogo brilho" id="pct0">50%</span><div class="combo txt-jogo brilho" id="combo0"></div></div>
    <div class="lado l1"><div class="nome txt-jogo" id="nome1"></div><div class="votos txt-jogo" id="votos1">0</div>
      <span class="pct txt-jogo brilho" id="pct1">50%</span><div class="combo txt-jogo brilho" id="combo1"></div></div>
  </div>

  <div class="barra" id="barra"><div class="seg l0" id="seg0"></div><div class="seg l1"></div><div class="reflexo"></div><div class="faisca" id="faisca"></div></div>

  <div class="faixa l0"><div class="presentes" id="presentes0"></div><div class="ultimo" id="ultimo0"></div></div>
  <div class="faixa l1"><div class="presentes" id="presentes1"></div><div class="ultimo" id="ultimo1"></div></div>

  <template id="modelo-urna">
    <div class="corpo"></div>
    <div class="base"></div>
    <div class="tela">
      <div class="numero-linha"><span class="rot">Número:</span><span class="digitos"></span></div>
      <div class="nome-cand"></div>
      <div class="candidato"></div>
      <div class="instr">Aperte a tecla <b>VERDE</b> para CONFIRMAR</div>
      <div class="fim">FIM</div>
    </div>
    <div class="marca"></div>
    <div class="teclado">
      <div class="teclas"></div>
      <div class="botoes"><span class="botao branco">BRANCO</span><span class="botao corrige">CORRIGE</span><span class="botao confirma">CONFIRMA</span></div>
    </div>
    <div class="mao"><svg viewBox="0 0 200 440" aria-hidden="true">
      <defs>
        <linearGradient id="pele" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9b48a"/><stop offset=".55" stop-color="#f6cfab"/><stop offset="1" stop-color="#d79a6c"/></linearGradient>
        <linearGradient id="manga" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55595f"/><stop offset=".5" stop-color="#787d84"/><stop offset="1" stop-color="#43474c"/></linearGradient>
      </defs>
      <path d="M58 300 L150 300 L176 440 L36 440 Z" fill="url(#manga)"/>
      <rect x="54" y="280" width="100" height="28" rx="8" fill="#f2f2ee" stroke="#c9c9c2" stroke-width="2"/>
      <path d="M62 150 C58 200 60 250 72 284 L140 284 C152 250 156 210 152 168 C150 150 140 138 128 136 L110 132 Z" fill="url(#pele)" stroke="#b97c52" stroke-width="2.5"/>
      <rect x="86" y="2" width="30" height="160" rx="15" fill="url(#pele)" stroke="#b97c52" stroke-width="2.5"/>
      <path d="M92 12 Q101 4 110 12" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
      <rect x="112" y="128" width="28" height="56" rx="14" fill="url(#pele)" stroke="#b97c52" stroke-width="2.5"/>
      <rect x="128" y="140" width="26" height="54" rx="13" fill="url(#pele)" stroke="#b97c52" stroke-width="2.5"/>
      <rect x="136" y="160" width="22" height="46" rx="11" fill="url(#pele)" stroke="#b97c52" stroke-width="2.5"/>
      <path d="M66 210 C46 196 38 172 50 158 C60 150 76 160 84 178" fill="url(#pele)" stroke="#b97c52" stroke-width="2.5"/>
    </svg></div>
  </template>
  <div class="urna-maquina l0" id="urna0"></div>
  <div class="urna-maquina l1" id="urna1"></div>

  <div class="avisos" id="avisos"></div>
  <div class="ranking-box"><h3 class="titulo-jogo">🔥 Mais enviados</h3><ol class="ranking" id="ranking"></ol></div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
