<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urna da Live</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="importmap">{ "imports": { "three": "../kit/vendor/three.module.min.js", "three/addons/": "../kit/vendor/addons/" } }</script>
<style>
  .l0{--cor:var(--cor-a)}.l1{--cor:var(--cor-b)}
  /* a cena 3D (sala, mesa, urna e mão) fica no canvas atrás; aqui só o placar em HTML */
  .palco{background:#b85a1c}
  .palco.transparente{background:transparent}

  /* topo: troféus e cronômetro */
  .topo{position:absolute;left:40px;right:40px;top:34px;display:flex;align-items:center;justify-content:space-between}
  .trofeu{display:flex;align-items:center;gap:6px;font-size:84px;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
  .trofeu b{font-size:64px;color:#fff}
  .titulo{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:40px;color:#fff;opacity:.95}

  /* placar */
  .placar{position:absolute;left:30px;right:30px;top:205px;display:grid;grid-template-columns:1fr 1fr;text-align:center}
  .lado .nome{font-size:50px;color:#fff;white-space:nowrap;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:14px;height:64px}
  .lado .nome span{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .lado .retrato{flex:none;width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:50% 22%;
    border:4px solid var(--cor);background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.3)}
  .lado .votos{font-size:220px;color:#fff;display:inline-block;margin-top:4px}
  .lado .pct{font-size:90px;color:var(--cor);display:block;margin-top:2px;font-variant-numeric:tabular-nums}
  .lado .combo{height:64px;margin-top:4px;font-size:58px;color:var(--ouro);opacity:0;transition:opacity .2s}
  .lado .combo.on{opacity:1}

  /* barra */
  .barra{position:absolute;left:60px;right:60px;top:700px;height:80px;border-radius:40px;overflow:hidden;
    background:var(--cor-b);border:6px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.28),0 0 40px rgba(0,0,0,.25)}
  .seg{position:absolute;inset:0}
  .seg.l1{background:linear-gradient(180deg,color-mix(in srgb,var(--cor) 60%,#fff) 0%,var(--cor) 45%,color-mix(in srgb,var(--cor) 70%,#000) 100%)}
  .seg.l0{z-index:1;transform-origin:left center;transition:transform .5s cubic-bezier(.2,1.2,.4,1);
    background:linear-gradient(180deg,color-mix(in srgb,var(--cor) 60%,#fff) 0%,var(--cor) 45%,color-mix(in srgb,var(--cor) 70%,#000) 100%)}
  .reflexo{position:absolute;z-index:2;inset:8px 24px auto;height:17px;border-radius:9px;background:rgba(255,255,255,.45)}
  .faisca{position:absolute;z-index:3;top:-6px;bottom:-6px;left:0;width:10px;margin-left:-5px;background:#fff;
    box-shadow:0 0 18px 6px rgba(255,255,255,.9);transition:transform .5s cubic-bezier(.2,1.2,.4,1)}
  .barra.pulso0 .seg.l0,.barra.pulso1 .seg.l1{filter:brightness(1.35)}

  /* presentes de cada lado e quem votou por último, entre a barra e a urna */
  .faixa{position:absolute;left:30px;right:30px;top:800px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .presentes{display:flex;gap:22px}
  .presentes.l1{justify-content:flex-end}
  .faixa .chip-presente .emoji{font-size:66px}
  .faixa .chip-presente .efeito{font-size:36px}
  .ultimo{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:260px}
  .ultimo .avatar{--tam:84px;border-color:var(--cor,#fff);box-shadow:0 0 0 6px rgba(0,0,0,.2),0 0 30px var(--cor,#fff)}
  .ultimo .quem{font-size:34px;color:#fff;max-width:380px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ultimo .votou{font-size:26px;color:var(--cor,#fff)}

  /* rodapé: ranking à esquerda (4 linhas, abaixo da urna), avisos à direita sobre a manga da mão em repouso */
  .avisos{position:absolute;right:30px;width:410px;bottom:36px;flex-direction:column-reverse;align-items:flex-end}
  .avisos .aviso{font-size:26px;padding:7px 18px;border-radius:26px;line-height:1.15}
  .aviso .mais{color:var(--cor)}
  .ranking-box{position:absolute;left:30px;width:600px;bottom:30px}
  .ranking-box h3{margin:0 0 8px 6px;font-size:38px;color:#fff}
  .ranking-box .ranking{gap:9px}
  .ranking-box .ranking-item{font-size:28px;padding:4px 18px 4px 8px}
  .ranking-box .avatar.pequeno{--tam:50px}
  .ranking-box .ranking-pts{font-size:36px}

  /* virada */
  .virada{position:absolute;z-index:22;left:60px;right:60px;top:520px;padding:40px 30px;border-radius:48px;text-align:center;
    background:radial-gradient(120% 140% at 50% 0%,rgba(60,40,120,.96),rgba(12,8,30,.96));border:7px solid var(--cor);
    box-shadow:0 0 70px var(--cor);font-size:100px;color:#fff;animation:virada 2.6s cubic-bezier(.2,1.3,.4,1) both}
  .virada small{display:block;font-size:56px;color:var(--cor);margin-bottom:8px}
  @keyframes virada{0%{opacity:0;transform:scale(.4) rotate(-6deg)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(.96)}}
</style>
</head>
<body>
<div class="palco">
  <div class="topo">
    <div class="trofeu l0">🏆<b class="txt-jogo" id="trofeu0">0</b></div>
    <div class="pilula" id="relogio">∞</div>
    <div class="trofeu l1"><b class="txt-jogo" id="trofeu1">0</b>🏆</div>
  </div>
  <div class="titulo titulo-jogo" id="titulo"></div>

  <div class="placar">
    <div class="lado l0"><div class="nome txt-jogo" id="nome0"></div><div class="votos txt-jogo" id="votos0">0</div>
      <span class="pct txt-jogo brilho" id="pct0">50%</span><div class="combo txt-jogo brilho" id="combo0"></div></div>
    <div class="lado l1"><div class="nome txt-jogo" id="nome1"></div><div class="votos txt-jogo" id="votos1">0</div>
      <span class="pct txt-jogo brilho" id="pct1">50%</span><div class="combo txt-jogo brilho" id="combo1"></div></div>
  </div>

  <div class="barra" id="barra"><div class="seg l0" id="seg0"></div><div class="seg l1"></div><div class="reflexo"></div><div class="faisca" id="faisca"></div></div>

  <div class="faixa">
    <div class="presentes l0" id="presentes0"></div>
    <div class="ultimo" id="ultimo"></div>
    <div class="presentes l1" id="presentes1"></div>
  </div>

  <div class="avisos" id="avisos"></div>
  <div class="ranking-box"><h3 class="titulo-jogo">🔥 Mais enviados</h3><ol class="ranking" id="ranking"></ol></div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
