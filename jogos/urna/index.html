<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urna da Live</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .l0{--cor:var(--cor-a)}.l1{--cor:var(--cor-b)}

  /* fundo "estudio": sala quente com holofotes e uma mesa embaixo da urna */
  .estudio{position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(60% 34% at 50% 20%,rgba(255,226,150,.55),transparent 70%),
      radial-gradient(40% 30% at 12% 8%,rgba(255,190,90,.45),transparent 70%),
      radial-gradient(40% 30% at 88% 8%,rgba(255,190,90,.45),transparent 70%),
      linear-gradient(180deg,#7a3a12 0%,#c8681c 30%,#e08a2a 44%,#9b4a14 46%)}
  .estudio::after{content:"";position:absolute;left:-10%;right:-10%;top:44%;bottom:0;
    background:linear-gradient(180deg,#f2b25a 0%,#e7a04a 30%,#d48a38 100%);
    box-shadow:inset 0 14px 30px rgba(120,50,10,.45)}
  .estudio i{position:absolute;top:-10%;width:340px;height:120%;background:linear-gradient(180deg,rgba(255,240,200,.18),transparent 70%);
    filter:blur(6px);transform-origin:top center}
  .estudio i:nth-child(1){left:6%;transform:rotate(14deg)}
  .estudio i:nth-child(2){right:6%;transform:rotate(-14deg)}

  /* topo: troféus e cronômetro */
  .topo{position:absolute;left:40px;right:40px;top:34px;display:flex;align-items:center;justify-content:space-between}
  .trofeu{display:flex;align-items:center;gap:6px;font-size:84px;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
  .trofeu b{font-size:64px;color:#fff}
  .titulo{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:40px;color:#fff;opacity:.95}

  /* placar */
  .placar{position:absolute;left:30px;right:30px;top:210px;display:grid;grid-template-columns:1fr 1fr;text-align:center}
  .lado .nome{font-size:50px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px}
  .lado .votos{font-size:240px;color:#fff;display:inline-block;margin-top:6px}
  .lado .pct{font-size:96px;color:var(--cor);display:block;margin-top:4px;font-variant-numeric:tabular-nums}
  .lado .combo{height:70px;margin-top:6px;font-size:62px;color:var(--ouro);opacity:0;transition:opacity .2s}
  .lado .combo.on{opacity:1}

  /* barra */
  .barra{position:absolute;left:60px;right:60px;top:735px;height:84px;border-radius:42px;overflow:hidden;
    background:var(--cor-b);border:6px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.28),0 0 40px rgba(0,0,0,.25)}
  .seg{position:absolute;inset:0}
  .seg.l1{background:linear-gradient(180deg,color-mix(in srgb,var(--cor) 60%,#fff) 0%,var(--cor) 45%,color-mix(in srgb,var(--cor) 70%,#000) 100%)}
  .seg.l0{z-index:1;transform-origin:left center;transition:transform .5s cubic-bezier(.2,1.2,.4,1);
    background:linear-gradient(180deg,color-mix(in srgb,var(--cor) 60%,#fff) 0%,var(--cor) 45%,color-mix(in srgb,var(--cor) 70%,#000) 100%)}
  .reflexo{position:absolute;z-index:2;inset:8px 24px auto;height:18px;border-radius:9px;background:rgba(255,255,255,.45)}
  .faisca{position:absolute;z-index:3;top:-6px;bottom:-6px;left:0;width:10px;margin-left:-5px;background:#fff;
    box-shadow:0 0 18px 6px rgba(255,255,255,.9);transition:transform .5s cubic-bezier(.2,1.2,.4,1)}
  .barra.pulso0 .seg.l0,.barra.pulso1 .seg.l1{filter:brightness(1.35)}

  /* presentes de cada lado + último voto no meio */
  .meio{position:absolute;left:40px;right:40px;top:848px;height:190px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start}
  .presentes{display:flex;gap:26px}
  .presentes.l1{justify-content:flex-end}
  .ultimo{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:280px}
  .ultimo .avatar{border-color:var(--cor,#fff);box-shadow:0 0 0 6px rgba(0,0,0,.25),0 0 34px var(--cor,#fff)}
  .ultimo .quem{font-size:40px;color:#fff;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* urna eletrônica */
  .urna-maquina{position:absolute;left:70px;right:70px;top:1060px;height:400px;
    transform:perspective(1600px) rotateX(16deg);transform-origin:50% 100%}
  .corpo{position:absolute;inset:0;border-radius:34px;
    background:linear-gradient(180deg,#f4f4f2 0%,#dcdcd8 60%,#c4c4bf 100%);
    box-shadow:0 26px 0 #9c9c96,0 50px 60px rgba(80,30,0,.45),inset 0 4px 0 #fff}
  .tela{position:absolute;left:34px;top:44px;width:520px;height:320px;border-radius:12px;padding:22px 26px;
    background:linear-gradient(180deg,#f9faf6,#e9ece4);border:5px solid #8b8f88;box-shadow:inset 0 3px 10px rgba(0,0,0,.18);
    color:#222;font-family:"Baloo 2",sans-serif}
  .tela .rot{font-size:26px;color:#555}
  .digitos{display:flex;gap:12px;margin-top:6px}
  .digito{width:76px;height:96px;border:4px solid #333;border-radius:6px;background:#fff;display:grid;place-items:center;
    font:400 78px/1 var(--fonte-jogo);color:#111}
  .digito.cursor{animation:cursor .7s steps(1) infinite}
  @keyframes cursor{50%{background:#d9e8ff}}
  .candidato{position:absolute;right:24px;top:22px;width:150px;height:186px;border:4px solid #333;border-radius:6px;overflow:hidden;
    background:var(--cor,#bbb);display:grid;place-items:center;font:400 70px/1 var(--fonte-jogo);color:#fff;
    -webkit-text-stroke:8px var(--contorno);paint-order:stroke fill}
  .candidato img{width:100%;height:100%;object-fit:cover}
  .tela .nome-cand{position:absolute;left:26px;right:190px;top:168px;font-size:34px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tela .instr{position:absolute;left:26px;right:26px;bottom:14px;border-top:3px solid #333;padding-top:6px;font-size:21px;line-height:1.25;color:#333}
  .tela .fim{position:absolute;inset:0;display:grid;place-items:center;background:#f9faf6;font:400 150px/1 var(--fonte-jogo);color:#111;opacity:0}
  .tela .fim.on{animation:fim 1s ease both}
  @keyframes fim{0%,100%{opacity:0}10%,80%{opacity:1}}
  .marca{position:absolute;right:34px;top:14px;width:330px;text-align:center;font:800 28px/1 "Baloo 2",sans-serif;color:#555;letter-spacing:.06em}
  .teclado{position:absolute;right:34px;top:50px;width:330px;height:320px;border-radius:16px;padding:18px 22px;
    background:linear-gradient(180deg,#3a3a3a,#232323);box-shadow:inset 0 3px 0 rgba(255,255,255,.12)}
  .teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px}
  .tecla{height:48px;border-radius:8px;background:linear-gradient(180deg,#2a2a2a,#0f0f0f);box-shadow:0 5px 0 #000,inset 0 2px 0 rgba(255,255,255,.18);
    display:grid;place-items:center;font:800 32px/1 "Baloo 2",sans-serif;color:#fff;transition:transform .08s,box-shadow .08s}
  .tecla.zero{grid-column:2}
  .tecla.apertada{transform:translateY(5px);box-shadow:0 0 0 #000,inset 0 2px 0 rgba(255,255,255,.18);filter:brightness(1.8)}
  .botoes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .botao{height:52px;border-radius:8px;display:grid;place-items:center;font:800 17px/1 "Baloo 2",sans-serif;color:#111;
    box-shadow:0 5px 0 rgba(0,0,0,.6);transition:transform .08s,box-shadow .08s}
  .botao.branco{background:#f4f4f4}.botao.corrige{background:#ff8a1f}.botao.confirma{background:#2fcf55}
  .botao.apertada{transform:translateY(5px);box-shadow:none;filter:brightness(1.3)}
  .dedo{position:absolute;z-index:4;left:0;top:0;font-size:96px;line-height:1;pointer-events:none;opacity:0;
    transition:transform .16s cubic-bezier(.3,.8,.4,1),opacity .3s;filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}
  .dedo.on{opacity:1}

  /* avisos e ranking */
  .avisos{position:absolute;left:630px;right:30px;bottom:40px;flex-direction:column-reverse;align-items:stretch}
  .avisos .aviso{font-size:26px;padding:8px 18px;border-radius:26px;line-height:1.15}
  .aviso .mais{color:var(--cor)}
  .ranking-box{position:absolute;left:40px;width:560px;bottom:36px}
  .ranking-box h3{margin:0 0 10px 6px;font-size:40px;color:#fff}
  .ranking-box .ranking-item{font-size:28px;padding:4px 18px 4px 8px}
  .ranking-box .avatar.pequeno{--tam:52px}
  .ranking-box .ranking-pts{font-size:36px}

  /* virada */
  .virada{position:absolute;z-index:22;left:60px;right:60px;top:560px;padding:40px 30px;border-radius:48px;text-align:center;
    background:radial-gradient(120% 140% at 50% 0%,rgba(60,40,120,.96),rgba(12,8,30,.96));border:7px solid var(--cor);
    box-shadow:0 0 70px var(--cor);font-size:100px;color:#fff;animation:virada 2.6s cubic-bezier(.2,1.3,.4,1) both}
  .virada small{display:block;font-size:56px;color:var(--cor);margin-bottom:8px}
  @keyframes virada{0%{opacity:0;transform:scale(.4) rotate(-6deg)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(.96)}}

  .transparente .estudio{display:none}
</style>
</head>
<body>
<div class="palco">
  <div class="estudio" id="estudio"><i></i><i></i></div>

  <div class="topo">
    <div class="trofeu l0">🏆<b class="txt-jogo" id="trofeu0">0</b></div>
    <div class="pilula" id="relogio">∞</div>
    <div class="trofeu l1"><b class="txt-jogo" id="trofeu1">0</b>🏆</div>
  </div>
  <div class="titulo titulo-jogo" id="titulo"></div>

  <div class="placar">
    <div class="lado l0"><div class="nome txt-jogo" id="nome0"></div><div class="votos txt-jogo" id="votos0">0</div>
      <span class="pct txt-jogo brilho" id="pct0">50%</span><div class="combo txt-jogo brilho" id="combo0"></div></div>
    <div class="lado l1"><div class="nome txt-jogo" id="nome1"></div><div class="votos txt-jogo" id="votos1">0</div>
      <span class="pct txt-jogo brilho" id="pct1">50%</span><div class="combo txt-jogo brilho" id="combo1"></div></div>
  </div>

  <div class="barra" id="barra"><div class="seg l0" id="seg0"></div><div class="seg l1"></div><div class="reflexo"></div><div class="faisca" id="faisca"></div></div>

  <div class="meio">
    <div class="presentes l0" id="presentes0"></div>
    <div class="ultimo" id="ultimo"></div>
    <div class="presentes l1" id="presentes1"></div>
  </div>

  <div class="urna-maquina" id="urna">
    <div class="corpo"></div>
    <div class="tela">
      <div class="rot">Número</div>
      <div class="digitos" id="digitos"></div>
      <div class="candidato" id="candidato">?</div>
      <div class="nome-cand" id="nomeCand"></div>
      <div class="instr">Aperte a tecla:<br><b>VERDE</b> para CONFIRMAR este voto</div>
      <div class="fim" id="fim">FIM</div>
    </div>
    <div class="marca" id="marca"></div>
    <div class="teclado" id="teclado">
      <div class="teclas" id="teclas"></div>
      <div class="botoes"><span class="botao branco">BRANCO</span><span class="botao corrige">CORRIGE</span><span class="botao confirma" id="confirma">CONFIRMA</span></div>
    </div>
    <div class="dedo" id="dedo">👆</div>
  </div>

  <div class="avisos" id="avisos"></div>
  <div class="ranking-box"><h3 class="titulo-jogo">🔥 Mais enviados</h3><ol class="ranking" id="ranking"></ol></div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
