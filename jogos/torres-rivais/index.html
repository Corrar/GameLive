<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torres Rivais</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .t0{--cor:var(--cor0)}.t1{--cor:var(--cor1)}

  /* topo: troféus de rodadas e pílula da rodada */
  .topo{position:absolute;left:40px;right:40px;top:34px;display:flex;align-items:center;justify-content:space-between}
  .trofeu{display:flex;align-items:center;gap:6px;font-size:84px;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
  .trofeu b{font-size:64px;color:#fff}
  .pilula{font-size:56px}
  .titulo{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:44px;color:var(--ouro)}

  /* placar: nome, blocos, % da meta e combo */
  .placar{position:absolute;left:30px;right:30px;top:212px;display:grid;grid-template-columns:1fr 1fr;text-align:center}
  .lado .nome{display:flex;align-items:center;justify-content:center;gap:14px;padding:0 10px;font-size:50px;color:#fff;white-space:nowrap}
  .lado .nome span{overflow:hidden;text-overflow:ellipsis}
  .letra{flex:none;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--cor);border:5px solid #fff;
    box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 26px var(--cor);font-size:42px;color:#fff}
  .lado .blocos{font-size:170px;color:#fff;display:inline-block;margin-top:4px;font-variant-numeric:tabular-nums}
  .lado .pct{font-size:76px;color:var(--cor);display:block;margin-top:2px;font-variant-numeric:tabular-nums}
  .lado .pct small{font-size:38px;color:#fff;margin-left:8px}
  .lado .combo{height:62px;margin-top:4px;font-size:58px;color:var(--ouro);opacity:0;transition:opacity .2s}
  .lado .combo.on{opacity:1}

  /* faixa do meio: presentes de cada lado e quem mandou por último */
  .meio{position:absolute;left:30px;right:30px;top:612px;height:200px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start}
  .presentes{display:flex;gap:22px}
  .presentes.dir{justify-content:flex-end}
  .chip-presente{min-width:120px}
  .chip-presente .efeito{font-size:38px}
  .ultimo{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:250px}
  .ultimo .avatar{border-color:var(--cor,#fff);box-shadow:0 0 0 6px rgba(0,0,0,.25),0 0 34px var(--cor,#fff)}
  .ultimo .quem{font-size:38px;color:#fff;max-width:330px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ultimo .espera{font-size:110px;line-height:1.2;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}

  /* chão: ranking à esquerda, avisos à direita */
  .ranking-box{position:absolute;left:34px;width:580px;bottom:26px}
  .ranking-box h3{margin:0 0 10px 6px;font-size:40px;color:#fff}
  .ranking-box .ranking{gap:9px}
  .ranking-box .ranking-item{font-size:28px;padding:4px 18px 4px 8px}
  .ranking-box .avatar.pequeno{--tam:50px}
  .ranking-box .ranking-pts{font-size:36px}
  .avisos{position:absolute;left:640px;right:26px;bottom:30px;flex-direction:column-reverse;align-items:stretch}
  .avisos .aviso{font-size:25px;padding:8px 18px;border-radius:26px;line-height:1.15}
  .aviso .mais,.aviso .t0 b,.aviso .t1 b{color:var(--cor)}

  .vencedor .mvp{display:block;margin-top:18px;font-size:44px;color:#fff}
</style>
</head>
<body>
<div class="palco">
  <canvas id="cena" width="1080" height="1920"></canvas>

  <div class="topo">
    <div class="trofeu">🏆<b class="txt-jogo" id="trofeu0">0</b></div>
    <div class="pilula" id="rodada">RODADA 1</div>
    <div class="trofeu"><b class="txt-jogo" id="trofeu1">0</b>🏆</div>
  </div>
  <div class="titulo titulo-jogo" id="titulo"></div>

  <div class="placar">
    <div class="lado t0">
      <div class="nome txt-jogo"><b class="letra txt-jogo" id="letra0"></b><span id="nome0"></span></div>
      <div class="blocos txt-jogo" id="blocos0">0</div>
      <span class="pct txt-jogo brilho" id="pct0">0%</span>
      <div class="combo txt-jogo brilho" id="combo0"></div>
    </div>
    <div class="lado t1">
      <div class="nome txt-jogo"><b class="letra txt-jogo" id="letra1"></b><span id="nome1"></span></div>
      <div class="blocos txt-jogo" id="blocos1">0</div>
      <span class="pct txt-jogo brilho" id="pct1">0%</span>
      <div class="combo txt-jogo brilho" id="combo1"></div>
    </div>
  </div>

  <div class="meio">
    <div class="presentes" id="presentes0"></div>
    <div class="ultimo" id="ultimo"><span class="espera">🏗️</span><span class="quem txt-jogo">CONSTRUA!</span></div>
    <div class="presentes dir" id="presentes1"></div>
  </div>

  <div class="ranking-box"><h3 class="titulo-jogo">🔥 Quem mais construiu</h3><ol class="ranking" id="ranking"></ol></div>
  <div class="avisos" id="avisos"></div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
