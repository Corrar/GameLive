<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voo da Live</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="importmap">{ "imports": { "three": "../kit/vendor/three.module.min.js", "three/addons/": "../kit/vendor/addons/" } }</script>
<style>
  .cena3d{transition:filter .5s}

  /* sombra suave no pé da tela, por trás do ranking e da legenda */
  .chao-sombra{position:absolute;left:0;right:0;top:1500px;bottom:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(14,8,32,0),rgba(14,8,32,.5) 38%,rgba(14,8,32,.62))}

  /* topo: recorde, voo atual e quedas */
  .topo{position:absolute;left:30px;right:30px;top:22px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .canto{display:flex;align-items:center;gap:10px}
  .canto.dir{justify-content:flex-end;text-align:right}
  .canto .ico{font-size:78px;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
  .canto small{display:block;font-size:30px;color:var(--ouro)}
  .canto b{display:block;font-size:56px;color:#fff;font-variant-numeric:tabular-nums}
  .canto.dir small{color:#ff7aa8}
  .topo .pilula{font-size:46px;padding:8px 30px}

  /* distância gigante */
  .rotulo{position:absolute;left:0;right:0;top:128px;text-align:center;font-size:38px;color:#fff}
  .dist{position:absolute;left:0;right:0;top:166px;text-align:center;font-size:156px;color:#fff;font-variant-numeric:tabular-nums}
  .dist span{font-size:70px;color:#9ff7df;margin-left:10px}

  /* barra até a meta */
  .barra{position:absolute;left:56px;right:56px;top:350px;height:62px;border-radius:31px;
    background:linear-gradient(180deg,#1d1640,#2d2360);border:6px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.28),0 0 40px rgba(0,0,0,.25)}
  .barra .enche{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:25px;min-width:50px;
    background:linear-gradient(180deg,#b6ffe9 0%,#3df2c2 45%,#1aa784 100%)}
  .barra .reflexo{position:absolute;inset:7px 22px auto;height:14px;border-radius:7px;background:rgba(255,255,255,.35)}
  .marca{position:absolute;top:50%;translate:-50% -50%;line-height:1;pointer-events:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}
  .marca.ave{font-size:70px;z-index:2}
  .marca.rec{font-size:46px;top:-14px;z-index:1}
  .legendas-barra{position:absolute;left:60px;right:60px;top:422px;display:flex;justify-content:space-between;font-size:32px;color:#fff}
  .legendas-barra .pct{color:#9ff7df}
  .legendas-barra .fim{color:var(--ouro)}

  .avisos{position:absolute;left:30px;right:30px;top:478px}
  .avisos .aviso{font-size:27px;padding:8px 20px}

  /* efeitos ativos, logo acima do chão */
  .efeitos{position:absolute;left:20px;right:20px;top:1492px;display:flex;gap:12px;justify-content:center;pointer-events:none}
  .efeitos div{padding:6px 22px;border-radius:999px;font-size:34px;white-space:nowrap;color:#fff;border:4px solid #fff;
    box-shadow:0 5px 0 rgba(0,0,0,.35)}

  /* faixa grande: ataque do chat ou queda */
  .faixa{position:absolute;z-index:22;left:50px;right:50px;top:690px;padding:30px 30px 36px;border-radius:48px;text-align:center;
    background:radial-gradient(120% 140% at 50% 0%,rgba(60,40,120,.95),rgba(12,8,30,.95));border:7px solid var(--cor);
    box-shadow:0 0 0 8px rgba(0,0,0,.3),0 0 80px var(--cor);animation:faixa 2.4s cubic-bezier(.2,1.3,.4,1) both;pointer-events:none}
  .faixa .grande{display:block;font-size:96px;color:var(--cor);white-space:nowrap}
  .faixa .quem{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:18px}
  .faixa .quem .avatar{border-color:var(--cor);box-shadow:0 0 0 6px rgba(0,0,0,.25),0 0 34px var(--cor)}
  .faixa .nome{font-size:60px;color:#fff;max-width:640px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
  .faixa .nome small{display:block;font-size:34px;color:var(--cor)}
  @keyframes faixa{0%{opacity:0;transform:scale(.4) rotate(-6deg)}7%{opacity:1;transform:scale(1.08)}16%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:scale(.95)}}
  .faixa.turva .grande{animation:balanca .5s ease-in-out infinite alternate}
  .faixa.caos .grande{animation:sacode .12s linear infinite}
  @keyframes balanca{from{filter:blur(0)}to{filter:blur(3px);transform:skewX(-6deg)}}
  @keyframes sacode{25%{translate:-6px 3px}50%{translate:5px -4px}75%{translate:-3px -2px}}

  /* painel no chão: ranking e presentes */
  .ranking-box{position:absolute;left:28px;width:620px;top:1590px}
  .ranking-box h3,.legenda h3{margin:0 0 8px 6px;font-size:36px;color:#fff}
  .ranking-box .ranking{gap:7px}
  .ranking-box .ranking-item{font-size:28px;padding:3px 18px 3px 8px;--cor-time:#ff3d7f}
  .ranking-box .avatar.pequeno{--tam:50px}
  .ranking-box .ranking-pos{font-size:34px;width:46px}
  .ranking-box .ranking-pts{font-size:34px}
  .ranking-vazio{font-size:28px;color:rgba(255,255,255,.75);padding:8px 10px}
  .legenda{position:absolute;left:668px;right:24px;top:1590px}
  .legenda .itens{display:flex;flex-direction:column;gap:7px}
  .legenda .item{display:flex;align-items:center;gap:10px;height:57px;padding:0 14px 0 8px;border-radius:999px;
    background:linear-gradient(180deg,rgba(40,32,80,.92),rgba(14,10,32,.92));border:3px solid rgba(255,255,255,.22)}
  .legenda .emoji{font-size:44px;line-height:1}
  .legenda .txt{min-width:0;line-height:1.02}
  .legenda .txt b{display:block;font-size:26px;color:#ff8fb3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legenda .txt span{display:block;font-family:var(--fonte-jogo);font-size:25px;color:#fff;white-space:nowrap}
</style>
</head>
<body>
<div class="palco">
  <div class="chao-sombra"></div>
  <header class="topo">
    <div class="canto"><span class="ico" id="trofeu">🏆</span><div><small class="txt-jogo">RECORDE</small><b class="txt-jogo" id="recorde">0</b></div></div>
    <div class="pilula" id="voo">VOO 1</div>
    <div class="canto dir"><div><small class="txt-jogo">QUEDAS</small><b class="txt-jogo" id="quedas">0</b></div><span class="ico">💥</span></div>
  </header>
  <div class="rotulo titulo-jogo">Distância</div>
  <div class="dist txt-jogo" id="distBox"><b id="dist">0</b><span>m</span></div>

  <div class="barra">
    <div class="enche" id="progresso"><div class="reflexo"></div></div>
    <span class="marca rec" id="marcaRec" title="recorde">🚩</span>
    <span class="marca ave" id="marcaAve">🐤</span>
  </div>
  <div class="legendas-barra txt-jogo"><span class="pct" id="pct">0%</span><span class="fim" id="meta">🏁 1.000.000</span></div>

  <div class="avisos" id="avisos"></div>
  <div class="efeitos txt-jogo" id="efeitos"></div>

  <section class="ranking-box">
    <h3 class="titulo-jogo">😈 Mais atrapalharam</h3>
    <ol class="ranking" id="ranking"></ol>
  </section>
  <section class="legenda">
    <h3 class="titulo-jogo">🎁 Presentes</h3>
    <div class="itens" id="legenda"></div>
  </section>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
