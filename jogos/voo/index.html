<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voo da Live</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  body{font-weight:800}
  #tela{transition:filter .5s}
  .hud{position:absolute;left:40px;right:40px;top:40px;padding:20px 30px 24px;border-radius:34px;background:rgba(8,10,20,.84);
    border:3px solid rgba(255,255,255,.12);box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
  .linha{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
  .hud small{display:block;font-size:28px;font-weight:900;letter-spacing:.2em;color:rgba(255,255,255,.62)}
  .dist{font-size:116px;font-weight:900;line-height:1;color:#3df2c2;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .rec{text-align:right}
  .rec b{display:block;font-size:64px;font-weight:900;line-height:1.05;color:#ffc23d;font-variant-numeric:tabular-nums}
  .trilho{position:relative;height:26px;margin-top:18px;border-radius:13px;background:#1b2036;border:2px solid rgba(255,255,255,.18);overflow:hidden}
  .trilho div{height:100%;width:0;background:linear-gradient(90deg,#3df2c2,#ffc23d);border-radius:13px}
  .meta{margin-top:10px;display:flex;justify-content:space-between;gap:16px;font-size:30px;color:rgba(255,255,255,.62)}
  .efeitos{position:absolute;left:30px;right:30px;top:1664px;display:flex;gap:12px;flex-wrap:nowrap;justify-content:center}
  .efeitos div{padding:8px 20px;border-radius:999px;font-size:34px;white-space:nowrap;font-weight:900;color:#0b0d17}
  .avisos{position:absolute;left:40px;right:40px;top:400px}
  .queda{position:absolute;left:60px;right:60px;top:820px;padding:40px 30px;border-radius:40px;text-align:center;
    background:rgba(8,10,20,.92);border:5px solid #ff3d7f;font-size:84px;font-weight:900;line-height:1.05;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:queda 2.4s cubic-bezier(.2,1.3,.4,1) both}
  .queda small{display:block;font-size:40px;letter-spacing:.16em;color:#ff3d7f;margin-bottom:10px}
  @keyframes queda{0%{opacity:0;transform:scale(.5) rotate(-4deg)}15%{opacity:1;transform:scale(1.05)}25%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
  .ultima{color:#ff8fb3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .meta span:last-child{flex:none}
  .legenda{position:absolute;left:30px;right:30px;bottom:30px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .legenda div{padding:10px 18px;border-radius:999px;background:rgba(8,10,20,.84);border:2px solid rgba(255,255,255,.14);font-size:28px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legenda i{font-style:normal;color:#ff3d7f}
</style>
</head>
<body>
<div class="palco">
  <canvas id="tela" width="1080" height="1920"></canvas>
  <header class="hud">
    <div class="linha">
      <div><small>DISTÂNCIA</small><div class="dist" id="dist">0</div></div>
      <div class="rec"><small>RECORDE</small><b id="recorde">0</b></div>
    </div>
    <div class="trilho"><div id="progresso"></div></div>
    <div class="meta"><span class="ultima" id="ultima"></span><span id="meta"></span></div>
  </header>
  <div class="efeitos" id="efeitos"></div>
  <div class="avisos" id="avisos"></div>
  <footer class="legenda" id="legenda"></footer>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
