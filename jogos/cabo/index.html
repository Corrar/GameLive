<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabo de Guerra</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .t0{--cor:var(--cor0)}.t1{--cor:var(--cor1)}

  /* fundo "arena": céu noturno com holofotes; arquibancada e gramado são desenhados no canvas */
  .cenario{position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(55% 22% at 50% 14%,rgba(160,120,255,.45),transparent 70%),
      radial-gradient(70% 30% at 50% 100%,rgba(40,140,80,.35),transparent 70%),
      linear-gradient(180deg,#140a35 0%,#2a1766 22%,#3a2185 34%,#1b1045 35.5%,#0c3a24 68%,#08261a 76%,#06140e 100%)}
  .cenario i{position:absolute;top:-6%;width:300px;height:62%;filter:blur(8px);transform-origin:top center;
    background:linear-gradient(180deg,rgba(255,250,220,.26),transparent 80%);animation:holofote 7s ease-in-out infinite alternate}
  .cenario i:nth-child(1){left:2%;transform:rotate(18deg)}
  .cenario i:nth-child(2){right:2%;transform:rotate(-18deg);animation-delay:-3.5s}
  .cenario i:nth-child(3){left:38%;transform:rotate(4deg);opacity:.6;animation-delay:-1.7s}
  @keyframes holofote{from{rotate:-6deg}to{rotate:6deg}}
  .transparente .cenario{display:none}

  /* topo: troféus e rodada */
  .topo{position:absolute;left:36px;right:36px;top:30px;display:flex;align-items:center;justify-content:space-between}
  .trofeu{display:flex;align-items:center;gap:8px;font-size:80px;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
  .trofeu b{font-size:66px;color:#fff;display:inline-block}
  .topo .pilula{font-size:50px;padding:10px 34px}
  .titulo{position:absolute;left:0;right:0;top:148px;text-align:center;font-size:42px;color:#ffd23f}

  /* placar de força */
  .placar{position:absolute;left:24px;right:24px;top:204px;display:grid;grid-template-columns:1fr 1fr;text-align:center}
  .lado{min-width:0}
  .lado .nome{font-size:54px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 10px 10px}
  .lado .gente{font-size:28px;color:rgba(255,255,255,.85);margin-top:-4px}
  .lado .forca{font-size:190px;color:#fff;display:inline-block;margin-top:8px;font-variant-numeric:tabular-nums}
  .lado .pct{font-size:84px;color:var(--cor);display:block;margin-top:2px;font-variant-numeric:tabular-nums}
  .lado .combo{height:66px;margin-top:8px;font-size:58px;color:var(--ouro);opacity:0;transition:opacity .2s}
  .lado .combo.on{opacity:1}
  .vs{position:absolute;left:50%;top:400px;translate:-50% 0;font-size:64px;color:#ffd23f}

  /* força x2: pílula dourada com contagem regressiva em cima do time */
  .dobro{position:absolute;top:712px;width:340px;margin-left:-170px;display:flex;align-items:center;justify-content:center;gap:12px;
    padding:8px 22px;border-radius:999px;background:linear-gradient(180deg,#fff2a8,#ffc21f 50%,#e08a00);
    border:5px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 46px 10px rgba(255,200,40,.75);
    font-family:var(--fonte-jogo);font-size:46px;line-height:1;color:var(--contorno);
    opacity:0;scale:.6;transition:opacity .2s,scale .25s cubic-bezier(.2,1.5,.4,1)}
  .dobro.on{opacity:1;scale:1;animation:pulsa .45s ease-in-out infinite alternate}
  .dobro b{font-size:62px;color:#fff;-webkit-text-stroke:.11em var(--contorno);paint-order:stroke fill;min-width:84px;text-align:right}
  .dobro.d0{left:250px}.dobro.d1{left:830px}

  /* dica de comentário */
  .dica{position:absolute;left:30px;right:30px;top:1306px;text-align:center;font-size:44px;color:#fff}
  .dica b{color:var(--cor);font-size:56px}

  /* presentes dos dois lados + último a mandar no meio */
  .meio{position:absolute;left:24px;right:24px;top:1378px;height:200px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start}
  .presentes{display:flex;gap:18px}
  .presentes.dir{justify-content:flex-end}
  .chip-presente{min-width:150px}
  .chip-presente .efeito{font-size:36px;white-space:nowrap}
  .ultimo{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:260px}
  .ultimo .avatar{border-color:var(--cor,#fff);box-shadow:0 0 0 6px rgba(0,0,0,.25),0 0 34px var(--cor,#fff)}
  .ultimo .avatar.grande{--tam:136px}
  .ultimo .quem{font-size:36px;color:#fff;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ranking e avisos */
  .ranking-box{position:absolute;left:30px;width:590px;bottom:24px}
  .ranking-box h3{margin:0 0 10px 6px;font-size:40px;color:#fff}
  .ranking-box .ranking{gap:8px}
  .ranking-box .ranking-item{font-size:28px;padding:3px 18px 3px 8px}
  .ranking-box .avatar.pequeno{--tam:50px}
  .ranking-box .ranking-pts{font-size:36px}
  .avisos{position:absolute;left:640px;right:24px;bottom:24px;flex-direction:column-reverse;align-items:stretch}
  .avisos .aviso{font-size:25px;padding:8px 18px;border-radius:26px;line-height:1.15}
  .aviso b{color:var(--cor)}
  .aviso .mais{color:#ffd23f}

  .vencedor{top:300px}
</style>
</head>
<body>
<div class="palco">
  <div class="cenario"><i></i><i></i><i></i></div>
  <canvas id="cena" width="1080" height="1920"></canvas>

  <div class="topo">
    <div class="trofeu t0">🏆<b class="txt-jogo" id="trofeu0">0</b></div>
    <div class="pilula" id="rodada">RODADA 1</div>
    <div class="trofeu t1"><b class="txt-jogo" id="trofeu1">0</b>🏆</div>
  </div>
  <div class="titulo titulo-jogo" id="titulo"></div>

  <div class="placar">
    <div class="lado t0"><div class="nome txt-jogo" id="nome0"></div><div class="gente" id="gente0"></div>
      <div class="forca txt-jogo" id="forca0">0</div><span class="pct txt-jogo brilho" id="pct0">50%</span>
      <div class="combo txt-jogo brilho" id="combo0"></div></div>
    <div class="lado t1"><div class="nome txt-jogo" id="nome1"></div><div class="gente" id="gente1"></div>
      <div class="forca txt-jogo" id="forca1">0</div><span class="pct txt-jogo brilho" id="pct1">50%</span>
      <div class="combo txt-jogo brilho" id="combo1"></div></div>
  </div>
  <div class="vs txt-jogo">VS</div>

  <div class="dobro d0" id="dobro0">🍩 x2 <b id="dobroS0">0s</b></div>
  <div class="dobro d1" id="dobro1">🍩 x2 <b id="dobroS1">0s</b></div>

  <div class="dica txt-jogo" id="dica"></div>
  <div class="meio">
    <div class="presentes" id="presentes0"></div>
    <div class="ultimo" id="ultimo"></div>
    <div class="presentes dir" id="presentes1"></div>
  </div>

  <div class="ranking-box"><h3 class="titulo-jogo">🔥 Quem mais puxou</h3><ol class="ranking" id="ranking"></ol></div>
  <div class="avisos" id="avisos"></div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
