<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="GameLive — jogos que o chat da sua live joga">
  <defs>
    <linearGradient id="gt" gradientUnits="userSpaceOnUse" x1="600" y1="0" x2="800" y2="0">
      <stop offset="0" stop-color="#3df2c2"/>
      <stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3df2c2"/>
      <stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3df2c2"/>
      <stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <radialGradient id="nevoa1" cx=".2" cy=".2" r=".6">
      <stop offset="0" stop-color="#3df2c2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3df2c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nevoa2" cx=".85" cy=".9" r=".6">
      <stop offset="0" stop-color="#ff3d7f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff3d7f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cartao"><rect width="1280" height="420" rx="28"/></clipPath>
    <style>
      .pisca{animation:pisca 3.2s ease-in-out infinite}
      .p2{animation-delay:-1.1s}.p3{animation-delay:-2.2s}.p4{animation-delay:-.6s}
      @keyframes pisca{0%,100%{opacity:.15}50%{opacity:.9}}
      .vivo{animation:vivo 1.4s ease-in-out infinite}
      @keyframes vivo{50%{opacity:.25}}
      .sobe{animation:sobe 6s ease-in-out infinite;opacity:0}
      .s2{animation-delay:-2s}.s3{animation-delay:-4s}
      @keyframes sobe{0%{opacity:0;transform:translateY(40px)}12%,70%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
      .barra{animation:barra 5s ease-in-out infinite;transform-origin:0 0}
      @keyframes barra{0%,100%{transform:scaleX(.42)}50%{transform:scaleX(.64)}}
      .brilho{animation:brilho 4s linear infinite}
      @keyframes brilho{from{transform:translateX(-700px)}to{transform:translateX(1400px)}}
      text{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
      @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
    </style>
  </defs>

  <g clip-path="url(#cartao)">
    <rect width="1280" height="420" fill="#0b0d17"/>
    <rect width="1280" height="420" fill="url(#nevoa1)"/>
    <rect width="1280" height="420" fill="url(#nevoa2)"/>
    <!-- estrelas -->
    <g fill="#fff">
      <circle class="pisca" cx="72" cy="58" r="2"/><circle class="pisca p2" cx="210" cy="340" r="1.6"/>
      <circle class="pisca p3" cx="388" cy="40" r="1.8"/><circle class="pisca p4" cx="620" cy="378" r="1.4"/>
      <circle class="pisca p2" cx="700" cy="70" r="2"/><circle class="pisca" cx="1210" cy="44" r="1.8"/>
      <circle class="pisca p3" cx="1240" cy="360" r="1.6"/><circle class="pisca p4" cx="540" cy="200" r="1.3"/>
      <circle class="pisca p2" cx="160" cy="190" r="1.4"/><circle class="pisca p3" cx="980" cy="22" r="1.4"/>
    </g>
    <!-- faixa de brilho passando -->
    <rect class="brilho" x="0" y="0" width="240" height="420" fill="#fff" opacity=".035" transform="skewX(-20)"/>

    <!-- marca -->
    <g transform="translate(96 118)">
      <rect width="184" height="184" rx="50" fill="#0b0d17" stroke="url(#gd)" stroke-width="8"/>
      <path d="M68 50c0-8 9-13 16-9l60 38c6 4 6 13 0 17l-60 38c-7 4-16-1-16-9V50Z" fill="url(#gd)"/>
      <circle class="vivo" cx="150" cy="40" r="15" fill="#ff3d7f" stroke="#0b0d17" stroke-width="6"/>
    </g>

    <!-- nome e frase -->
    <text x="322" y="214" font-size="104" font-weight="900" fill="#eef1fa" letter-spacing="-4">Game<tspan fill="url(#gt)">Live</tspan></text>
    <text x="328" y="268" font-size="30" font-weight="600" fill="#9aa3bd">jogos que o chat da sua live joga com você</text>

    <!-- pílula ao vivo -->
    <g transform="translate(330 300)">
      <rect width="148" height="40" rx="20" fill="#ff3d7f"/>
      <circle class="vivo" cx="26" cy="20" r="6" fill="#fff"/>
      <text x="42" y="27" font-size="18" font-weight="800" fill="#fff" letter-spacing="3">AO VIVO</text>
    </g>
    <text x="496" y="327" font-size="20" font-weight="600" fill="#5f6886">TikTok LIVE · OBS · Node.js</text>

    <!-- tela com barra de votação e presentes subindo -->
    <g transform="translate(940 60)">
      <rect width="250" height="300" rx="26" fill="#121627" stroke="#262d47" stroke-width="2"/>
      <rect x="18" y="24" width="214" height="26" rx="13" fill="#262d47"/>
      <rect class="barra" x="18" y="24" width="214" height="26" rx="13" fill="url(#g)"/>
      <text x="18" y="78" font-size="15" font-weight="800" fill="#3df2c2">TIME A</text>
      <text x="232" y="78" font-size="15" font-weight="800" fill="#ff3d7f" text-anchor="end">TIME B</text>
      <text x="125" y="150" font-size="54" font-weight="900" fill="#262d47" text-anchor="middle">VS</text>
      <g class="sobe">
        <rect x="18" y="200" width="214" height="44" rx="14" fill="#1b2036"/>
        <circle cx="42" cy="222" r="11" fill="#ff3d7f"/>
        <text x="62" y="228" font-size="15" font-weight="700" fill="#eef1fa">luna.gg  +5 votos</text>
      </g>
      <g class="sobe s2">
        <rect x="18" y="200" width="214" height="44" rx="14" fill="#1b2036"/>
        <circle cx="42" cy="222" r="11" fill="#3df2c2"/>
        <text x="62" y="228" font-size="15" font-weight="700" fill="#eef1fa">beto_rx  nitro!</text>
      </g>
      <g class="sobe s3">
        <rect x="18" y="200" width="214" height="44" rx="14" fill="#1b2036"/>
        <circle cx="42" cy="222" r="11" fill="#ffc23d"/>
        <text x="62" y="228" font-size="15" font-weight="700" fill="#eef1fa">cami.zz  corta a linha</text>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="418" rx="27" fill="none" stroke="#262d47" stroke-width="2"/>
</svg>
