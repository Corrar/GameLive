  </defs>
  <!-- corpo: controle/tela arredondada -->
  <rect x="16" y="16" width="224" height="224" rx="60" fill="#0b0d17"/>
  <rect x="16" y="16" width="224" height="224" rx="60" fill="none" stroke="url(#g)" stroke-width="10"/>
  <!-- play que vira balão de chat -->
  <path d="M98 76c0-9 10-15 18-10l70 44c7 5 7 15 0 20l-70 44c-8 5-18-1-18-10V76Z" fill="url(#g)"/>
  <path d="M98 76c0-9 10-15 18-10l70 44c7 5 7 15 0 20l-70 44c-8 5-18-1-18-10V76Z" fill="url(#brilho)"/>
  <!-- ponto ao vivo -->
  <circle cx="190" cy="66" r="18" fill="#ff3d7f" stroke="#0b0d17" stroke-width="7"/>
